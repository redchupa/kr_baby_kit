record_measurement:
  name: 측정값 기록
  description: 자녀의 키·몸무게·머리둘레를 저장하고 백분위를 갱신합니다.
  fields:
    child_id:
      name: 자녀 ID
      description: Config entry에서 발급된 child_id. 미지정 시 등록된 단일 자녀에 적용.
      example: "ab12cd34ef56"
      required: false
      selector:
        text:
    date:
      name: 측정일
      description: ISO 형식 (YYYY-MM-DD). 비우면 오늘(Asia/Seoul).
      example: "2026-05-12"
      required: false
      selector:
        date:
    height:
      name: 키 (cm)
      required: false
      example: 75.4
      selector:
        number:
          min: 30
          max: 200
          step: 0.1
          unit_of_measurement: cm
    weight:
      name: 몸무게 (kg)
      required: false
      example: 9.2
      selector:
        number:
          min: 1
          max: 100
          step: 0.05
          unit_of_measurement: kg
    head:
      name: 머리둘레 (cm)
      required: false
      example: 46.0
      selector:
        number:
          min: 25
          max: 65
          step: 0.1
          unit_of_measurement: cm

delete_measurement:
  name: 측정값 삭제
  description: 특정 날짜의 측정 기록을 삭제합니다. 항목을 지정하면 해당 항목만, 비우면 그 날짜 기록 전체를 지웁니다.
  fields:
    child_id:
      name: 자녀 ID
      description: 미지정 시 등록된 단일 자녀에 적용.
      required: false
      selector:
        text:
    date:
      name: 측정일
      description: 삭제할 기록의 날짜 (YYYY-MM-DD)
      example: "2026-05-12"
      required: true
      selector:
        date:
    kinds:
      name: 삭제할 항목
      description: 비우면 해당 날짜 기록 전체 삭제.
      required: false
      selector:
        select:
          multiple: true
          options:
            - label: 키
              value: height
            - label: 몸무게
              value: weight
            - label: 머리둘레
              value: head

get_measurements:
  name: 측정 기록 조회
  description: 저장된 키·몸무게·머리둘레 기록을 날짜순으로 돌려줍니다 (응답 전용).
  fields:
    child_id:
      name: 자녀 ID
      required: false
      selector:
        text:
    start_date:
      name: 시작일
      required: false
      selector:
        date:
    end_date:
      name: 종료일
      required: false
      selector:
        date:

mark_event_done:
  name: 일정 완료 표시
  description: 예방접종·영유아 검진·구강검진을 완료로 표시합니다. 완료된 일정은 다음 일정 센서와 이번 달 알림에서 빠지고, 캘린더에는 ✅ 로 표시됩니다. 표시하지 않아도 기간이 끝나면 자동으로 '기간 지남' 처리됩니다.
  fields:
    child_id:
      name: 자녀 ID
      required: false
      selector:
        text:
    event_id:
      name: 일정 ID
      description: "예: DTaP_4, checkup_3, oral_checkup_1. 쉼표로 여러 개 지정 가능. 다음 일정 센서의 event_id 속성이나 get_schedule 서비스로 확인."
      example: "DTaP_1, IPV_1, Hib_1, PCV_1, RV_1"
      required: true
      selector:
        text:
    date:
      name: 완료일
      description: 비우면 오늘(Asia/Seoul).
      required: false
      selector:
        date:

unmark_event_done:
  name: 일정 완료 취소
  description: 잘못 표시한 완료 기록을 되돌립니다.
  fields:
    child_id:
      name: 자녀 ID
      required: false
      selector:
        text:
    event_id:
      name: 일정 ID
      description: 쉼표로 여러 개 지정 가능.
      example: "DTaP_4"
      required: true
      selector:
        text:

get_schedule:
  name: 전체 일정 조회
  description: 예방접종·검진·구강검진 전체 일정과 event_id, 상태(done/open/upcoming/past)를 돌려줍니다 (응답 전용).
  fields:
    child_id:
      name: 자녀 ID
      required: false
      selector:
        text:

log_care:
  name: 돌봄 기록 추가
  description: 무선 버튼·모션 자동화·스크립트에서 수유·기저귀·수면·터미타임·유축·체온·메모를 바로 기록합니다.
  fields:
    child_id:
      name: 자녀 ID
      description: 미지정 시 등록된 단일 자녀에 자동 적용.
      required: false
      selector:
        text:
    kind:
      name: 기록 종류
      required: true
      example: "feeding"
      selector:
        select:
          options:
            - label: 수유 (feeding)
              value: feeding
            - label: 기저귀 (diaper)
              value: diaper
            - label: 수면 (sleep)
              value: sleep
            - label: 터미타임 (tummy_time)
              value: tummy_time
            - label: 유축 (pumping)
              value: pumping
            - label: 체온 (temperature)
              value: temperature
            - label: 메모 (note)
              value: note
    method:
      name: 수유 방법
      required: false
      example: "formula"
      selector:
        select:
          options:
            - label: 분유 (formula)
              value: formula
            - label: 젖병 모유 (bottle)
              value: bottle
            - label: 모유 좌 (breast_left)
              value: breast_left
            - label: 모유 우 (breast_right)
              value: breast_right
            - label: 모유 양쪽 (breast_both)
              value: breast_both
            - label: 이유식 (solid)
              value: solid
    amount_ml:
      name: 용량 (mL)
      required: false
      example: 140
      selector:
        number:
          min: 0
          max: 1000
          step: 5
          unit_of_measurement: mL
    duration_min:
      name: 시간 (분)
      required: false
      example: 60
      selector:
        number:
          min: 0
          max: 1440
          step: 1
          unit_of_measurement: min
    diaper_type:
      name: 기저귀 종류
      required: false
      selector:
        select:
          options:
            - label: 소변 (wet)
              value: wet
            - label: 대변 (solid)
              value: solid
            - label: 소변+대변 (both)
              value: both
    temperature_c:
      name: 체온 (°C)
      required: false
      example: 36.7
      selector:
        number:
          min: 34
          max: 43
          step: 0.1
          unit_of_measurement: "°C"
    note:
      name: 메모
      required: false
      selector:
        text:

start_timer:
  name: 돌봄 타이머 시작
  description: 수면·수유·터미타임·유축 실시간 타이머를 시작합니다 (모션 기반 자동 입면 감지 등에 활용).
  fields:
    child_id:
      name: 자녀 ID
      required: false
      selector:
        text:
    kind:
      name: 타이머 종류
      required: true
      example: "sleep"
      selector:
        select:
          options:
            - label: 수면 (sleep)
              value: sleep
            - label: 수유 (feeding)
              value: feeding
            - label: 터미타임 (tummy_time)
              value: tummy_time
            - label: 유축 (pumping)
              value: pumping

stop_timer:
  name: 돌봄 타이머 종료 및 저장
  description: 실행 중인 실시간 타이머를 종료하고 경과 시간(분)을 돌봄 기록으로 자동 저장합니다.
  fields:
    child_id:
      name: 자녀 ID
      required: false
      selector:
        text:
    kind:
      name: 타이머 종류
      required: true
      example: "sleep"
      selector:
        select:
          options:
            - label: 수면 (sleep)
              value: sleep
            - label: 수유 (feeding)
              value: feeding
            - label: 터미타임 (tummy_time)
              value: tummy_time
            - label: 유축 (pumping)
              value: pumping
    save_log:
      name: 기록으로 저장
      default: true
      required: false
      selector:
        boolean:
    amount_ml:
      name: 수유·유축 용량 (mL)
      required: false
      selector:
        number:
          min: 0
          max: 1000
          step: 5
          unit_of_measurement: mL
    note:
      name: 메모
      required: false
      selector:
        text:
